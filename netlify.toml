# Netlify Configuration for Next.js Portfolio App
[build]
command = "pnpm install && pnpm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "20"
NODE_ENV = "production"

# ─── HTTP Security Headers ──────────────────────────────────────────────────
[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), microphone=(), camera=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.groq.com"

# ─── Cache Rules ─────────────────────────────────────────────────────────────
[[headers]]
for = "/api/*"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
Pragma = "no-cache"

[[headers]]
for = "/_next/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

